---
- name: Check Media Player Services Status
  hosts: all
  gather_facts: no

  tasks:
    - name: Check System Services Status
      ansible.builtin.raw: |
        if /etc/init.d/{{ item }} running; then
          PID=$(ps w | grep '[{{ item[0] }}]{{ item[1:] }}' | awk 'NR==1{print $1}')
          if [ -n "$PID" ]; then
            METRICS=$(top -n 1 2>/dev/null | awk -v pid="$PID" '$1 == pid {print "CPU: "$7", MEM: "$6}')
            [ -n "$METRICS" ] && echo "active ($METRICS)" || echo "active (PID: $PID)"
          else
            echo "active"
          fi
        else
          echo "inactive"
        fi
      loop:
        - squeezelite
        - lumimqtt
        - lumimqttd
        - lumi_volume_bridge
        - wan_watchdog
      register: system_status
      ignore_errors: yes
      changed_when: false

    - name: Report Services Status
      ansible.builtin.debug:
        msg: |
          ===== SYSTEM SERVICES =====
          {% for res in system_status.results %}
          {{ '%-25s' | format(res.item) }}: {{ res.stdout | default('unknown') | trim }}
          {% endfor %}