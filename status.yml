---
- name: Check Media Player Services Status
  hosts: all
  gather_facts: no

  tasks:
    - name: Check System Services Status
      become: yes
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - squeezelite
        - lumimqtt
        - lumimqttd
        - lumi_volume_bridge
      register: system_status
      ignore_errors: yes
      changed_when: false

    - name: Report Services Status
      ansible.builtin.debug:
        msg: |
          ===== SYSTEM SERVICES =====
          {% for res in system_status.results %}
          {{ '%-25s' | format(res.item) }}: {{ res.stdout | default('unknown') }}
          {% endfor %}