- name: 安装音频桥接所需的 Python MQTT 依赖包
  command: "opkg install python3-paho-mqtt python3-idna"
  register: opkg_mqtt
  changed_when: "'Configuring' in opkg_mqtt.stdout"

- name: 投递核心音量自适应桥接 Python 脚本
  copy:
    src: lumi_volume_bridge.py
    dest: /usr/bin/lumi_volume_bridge.py
    mode: '0755'
  register: py_script

- name: 投递系统级 Procd 守护进程初始化脚本
  copy:
    src: lumi_volume_bridge
    dest: /etc/init.d/lumi_volume_bridge
    mode: '0755'
  register: init_script

- name: 确保 Procd 守护进程服务已启用并运行（维持基础状态，防死锁）
  service:
    name: lumi_volume_bridge
    enabled: yes
    state: started

- name: 当脚本或初始化文件变更时重启服务（保证幂等性与即时生效）
  service:
    name: lumi_volume_bridge
    state: restarted
  when: py_script.changed or init_script.changed