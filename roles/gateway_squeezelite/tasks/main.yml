---
- name: 安装 squeezelite 组件
  command: "opkg install squeezelite"
  register: opkg_res
  changed_when: "'Configuring' in opkg_res.stdout"

- name: 动态渲染并接管极简版 Squeezelite 启动脚本 (直接注入配置与冷启守护)
  ansible.builtin.template:
    src: squeezelite.init.j2
    dest: /etc/init.d/squeezelite
    mode: '0755'
    owner: root
    group: root
  register: squeeze_init

- name: 清理废弃的 UCI 配置文件 (已全面转为 init 脚本硬编码直出)
  ansible.builtin.file:
    path: /etc/config/squeezelite
    state: absent

- name: 确保 Squeezelite 服务已启用并应用最新配置
  service:
    name: squeezelite
    enabled: yes
    state: "{{ 'restarted' if squeeze_init.changed else 'started' }}"