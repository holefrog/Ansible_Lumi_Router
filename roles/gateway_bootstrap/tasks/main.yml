---
- name: 打印即将设置的新密码
  ansible.builtin.debug:
    msg: "准备将 root 密码设置为: {{ new_root_password | default('') }}"

- name: 备份原有的 network 配置文件
  ansible.builtin.raw: cp -f /etc/config/network /etc/config/network.bak
  failed_when: false

- name: 备份原有的 wireless 配置文件
  ansible.builtin.raw: cp -f /etc/config/wireless /etc/config/wireless.bak
  failed_when: false

- name: 写入新的 network 配置文件 (使用 raw 模式)
  ansible.builtin.raw: |
    cat << 'EOF_NETWORK' > /etc/config/network
    {{ lookup('ansible.builtin.file', 'network') }}
    EOF_NETWORK

- name: 写入新的 wireless 配置文件
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/wireless.j2"
    dest: /etc/config/wireless
    owner: root
    group: root
    mode: '0644'

- name: 设置 root 用户密码
  ansible.builtin.raw: printf "%s\n%s\n" {{ new_root_password | default('') | quote }} {{ new_root_password | default('') | quote }} | passwd root

- name: 同步配置并重启设备
  ansible.builtin.raw: sync && reboot
  failed_when: false