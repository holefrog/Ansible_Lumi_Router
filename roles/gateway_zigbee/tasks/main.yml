---
- name: 远程拉取社区优化版 LumiRouter.bin 固件
  get_url:
    url: "https://github.com/igorlistopad/Lumi-Router-JN5169/releases/download/2021.3.20/LumiRouter.bin"
    dest: "/tmp/LumiRouter.bin"
    mode: '0644'

- name: 刷入 JN5169 芯片固件（防重刷幂等控制）
  command: jnflash /tmp/LumiRouter.bin
  args:
    creates: /etc/jnflash_completed
  register: jnflash_result
  failed_when: jnflash_result.rc is defined and jnflash_result.rc != 0

- name: 记录刷写完成状态钢印
  file:
    path: /etc/jnflash_completed
    state: touch
  when: jnflash_result.changed

- name: 物理清空 PDM 缓存
  command: jntool erase_pdm
  when: jnflash_result.changed
