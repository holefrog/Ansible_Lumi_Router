---
- name: 批量部署绿米一代网关全功能一体化解耦架构
  hosts: all
  gather_facts: false  # OpenWrt 缺少标准 Python 事实组件，关闭以加速引导
  pre_tasks:
    - name: 盲灌 OpenWrt 运行 Ansible 所必需的最精简 Python 依赖链
      raw: |
        opkg update && opkg install \
          python3-light \
          python3-decimal \
          python3-codecs \
          python3-logging \
          python3-multiprocessing \
          python3-urllib
      changed_when: false

    - name: 显式激活 Facts 收集（此时 Python 环境已就绪）
      setup:
  roles:
    - gateway_base
    - gateway_zigbee
    - gateway_lumi_mqtt
    - gateway_squeezelite
    - gateway_audio_bridge
    - gateway_wifi_watchdog
