---
- name: 批量部署绿米一代网关全功能一体化解耦架构
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: 更新 OpenWrt 软件源
      raw: opkg update
      tags: always

    - name: 盲灌 OpenWrt 运行 Ansible 所必需的 Python 依赖
      raw: "opkg install {{ item }}"
      loop:
        - python3-light
        - python3-decimal
        - python3-codecs
        - python3-logging
        - python3-multiprocessing
        - python3-urllib
      tags: always

    - name: 激活 Facts 收集（此时 Python 环境已就绪）
      setup:
      tags: always

  roles:
    - role: gateway_zigbee
      tags: ['zigbee']
    - role: gateway_lumi_mqtt
      tags: ['mqtt', 'audio']
    - role: gateway_audio_bridge
      tags: ['audio_bridge', 'audio']
    - role: gateway_wifi_watchdog
      tags: ['watchdog', 'wifi']

  post_tasks:
    - name: 全量部署完成，提示必须手动断电重启
      ansible.builtin.debug:
        msg: |
          =======================================================
          🎉 自动化部署已全部成功完成！
          ⚠️ 警告：由于硬件架构限制，Linux 的软件重启无法重置外围芯片。
          👉 请现在立刻【手动拔掉网关的电源插头】，然后再【重新插上】！
          只有彻底断电硬重启，Zigbee 芯片才会正常进入配网模式！
          =======================================================
      tags: always
