---
- name: 批量部署绿米一代网关全功能一体化解耦架构
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: 更新 OpenWrt 软件源
      raw: opkg update

    - name: 盲灌 OpenWrt 运行 Ansible 所必需的 Python 依赖 (当前进度: {{ item }})
      raw: "opkg install {{ item }}"
      loop:
        - python3-light
        - python3-decimal
        - python3-codecs
        - python3-logging
        - python3-multiprocessing

    - name: 激活 Facts 收集（此时 Python 环境已就绪）
      setup:
  roles:
    - gateway_base
    - gateway_zigbee
    - gateway_lumi_mqtt
    - gateway_squeezelite
    - gateway_audio_bridge
    - gateway_wifi_watchdog
