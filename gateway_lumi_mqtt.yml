---
- name: gateway_lumi_mqtt
  tasks:
    - name: Render configuration file
      template:
        src: lumimqtt.json.j2
        dest: /etc/lumimqtt.json
        mode: '0644'
      register: lumi_cfg
    - name: Restart service
      command: /etc/init.d/lumimqtt restart
      when: lumi_cfg.changed